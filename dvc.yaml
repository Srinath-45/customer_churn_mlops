
stages:
  preprocess:
    cmd: python src/data/preprocess.py
    deps:
      - src/data/preprocess.py
      - data/raw/dataset.csv
      - params.yaml
    params:
      - data
      - preprocessing
    outs:
      - data/processed/train.csv
      - data/processed/test.csv
      - artifacts/preprocessor/preprocessor.joblib
