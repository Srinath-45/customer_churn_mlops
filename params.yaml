
# Customer Churn Prediction - Model Configuration

data:
  raw_path: data/raw/dataset.csv
  processed_dir: data/processed

preprocessing:
  test_size: 0.2
  random_state: 42
  target_column: Churn
  id_column: customerID

models:
  logistic_regression:
    max_iter: 1000
    class_weight: balanced

  decision_tree:
    random_state: 42
    class_weight: balanced

  random_forest:
    n_estimators: 100
    random_state: 42
    class_weight: balanced

evaluation:
  selection_metric: f1_score
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score
    - roc_auc
